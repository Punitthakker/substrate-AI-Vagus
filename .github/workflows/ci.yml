name: honesty-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Anti-sycophancy evals must score 100
        run: python -c "from substrate.evals import run; r=run(); print(r['score']); assert r['score']==100, r"
