[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "substrate-vagus"
version = "0.9.0"
description = "Substrate AI - the Vagus Engine. An honest-advisor EQ layer beneath any LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = ["pydantic>=2.6", "httpx>=0.27"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[tool.setuptools]
packages = ["substrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
