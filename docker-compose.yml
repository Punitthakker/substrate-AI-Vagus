# Substrate with a fully local brain: no data leaves the machine.
#   docker compose up -d && docker compose exec ollama ollama pull llama3.1
services:
  substrate:
    build: .
    ports: ["8080:8080"]
    environment:
      SUBSTRATE_MODEL: ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.1
    volumes: ["substrate-data:/data"]
    depends_on: [ollama]
  ollama:
    image: ollama/ollama
    volumes: ["ollama-models:/root/.ollama"]
volumes:
  substrate-data:
  ollama-models:
